<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="包工头 baogongtou：像装修一样，把需求做到交付">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1D232B" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#12151A" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#12151A" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#12151A" stop-opacity="0"/>
    </linearGradient>
    <style>
      .sans { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Source Han Sans SC", sans-serif; }
      .floor { opacity: 0; }
      .f1 { animation: f1 10s infinite; }
      .f2 { animation: f2 10s infinite; }
      .f3 { animation: f3 10s infinite; }
      .f4 { animation: f4 10s infinite; }
      .badge { opacity: 0; animation: badge 10s infinite; }
      .hook { animation: hook 10s infinite; }
      @keyframes f1 { 0%, 4% { opacity: 0; transform: translateY(-70px); } 10%, 90% { opacity: 1; transform: translateY(0); } 97%, 100% { opacity: 0; transform: translateY(0); } }
      @keyframes f2 { 0%, 18% { opacity: 0; transform: translateY(-70px); } 24%, 90% { opacity: 1; transform: translateY(0); } 97%, 100% { opacity: 0; transform: translateY(0); } }
      @keyframes f3 { 0%, 32% { opacity: 0; transform: translateY(-70px); } 38%, 90% { opacity: 1; transform: translateY(0); } 97%, 100% { opacity: 0; transform: translateY(0); } }
      @keyframes f4 { 0%, 46% { opacity: 0; transform: translateY(-70px); } 52%, 90% { opacity: 1; transform: translateY(0); } 97%, 100% { opacity: 0; transform: translateY(0); } }
      @keyframes badge { 0%, 58% { opacity: 0; transform: translateY(8px); } 63%, 90% { opacity: 1; transform: translateY(0); } 97%, 100% { opacity: 0; } }
      @keyframes hook { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(6px); } }
    </style>
  </defs>

  <rect width="1200" height="380" rx="20" fill="#12151A"/>
  <rect width="1200" height="380" rx="20" fill="url(#grid)"/>
  <rect width="760" height="380" rx="20" fill="url(#fade)"/>

  <!-- 左侧文字 -->
  <g class="sans">
    <text x="64" y="92" font-size="14" letter-spacing="3" fill="#FF7A1A" font-weight="600">AGENT SKILL · CLAUDE CODE / CODEX</text>
    <text x="64" y="172" font-size="72" font-weight="800" fill="#F3F4F6">包工头</text>
    <text x="302" y="170" font-size="32" fill="#8B949E" font-weight="500">baogongtou</text>
    <text x="64" y="224" font-size="28" fill="#E6E8EB">像装修一样，把需求做到交付</text>
    <text x="64" y="264" font-size="17" fill="#8B949E">谈需求 → 出图纸 → 样板间 → 分期施工 → 监理把关 → 试用交付</text>

    <g font-size="15" fill="#FFB27A">
      <rect x="64" y="294" width="140" height="34" rx="17" fill="#FF7A1A" fill-opacity="0.10" stroke="#FF7A1A" stroke-opacity="0.55"/>
      <text x="134" y="316" text-anchor="middle">半自动 · 全自动</text>
      <rect x="216" y="294" width="156" height="34" rx="17" fill="#FF7A1A" fill-opacity="0.10" stroke="#FF7A1A" stroke-opacity="0.55"/>
      <text x="294" y="316" text-anchor="middle">大功能完工即试用</text>
      <rect x="384" y="294" width="156" height="34" rx="17" fill="#FF7A1A" fill-opacity="0.10" stroke="#FF7A1A" stroke-opacity="0.55"/>
      <text x="462" y="316" text-anchor="middle">要拍板的事不漏</text>
    </g>
  </g>

  <!-- 右侧：塔吊与逐层盖起的楼 -->
  <g stroke="#3A434F" stroke-width="3" fill="none" stroke-linecap="round">
    <line x1="1110" y1="62" x2="1110" y2="320"/>
    <line x1="1096" y1="320" x2="1124" y2="320"/>
    <line x1="820" y1="62" x2="1140" y2="62"/>
    <line x1="1110" y1="62" x2="1080" y2="40"/>
    <line x1="1080" y1="40" x2="1080" y2="62"/>
    <path d="M1110 100 L1096 86 M1110 140 L1096 126 M1110 180 L1096 166 M1110 220 L1096 206 M1110 260 L1096 246 M1110 300 L1096 286" stroke-width="2"/>
  </g>
  <g class="hook">
    <line x1="950" y1="62" x2="950" y2="72" stroke="#5B6573" stroke-width="2"/>
    <path d="M944 72 h12 v4 a6 6 0 0 1 -12 0z" fill="#FF7A1A"/>
  </g>

  <line x1="770" y1="320" x2="1150" y2="320" stroke="#3A434F" stroke-width="3" stroke-linecap="round"/>

  <g class="sans" font-size="15">
    <g class="floor f1">
      <rect x="840" y="274" width="220" height="46" rx="4" fill="#1C222A" stroke="#FF7A1A" stroke-opacity="0.75"/>
      <text x="856" y="303" fill="#F3F4F6">样板间（原型）</text>
      <rect x="1014" y="291" width="12" height="12" rx="2" fill="#FFB547"/><rect x="1032" y="291" width="12" height="12" rx="2" fill="#FFB547" fill-opacity="0.5"/>
    </g>
    <g class="floor f2">
      <rect x="840" y="228" width="220" height="46" rx="4" fill="#1C222A" stroke="#3A434F"/>
      <text x="856" y="257" fill="#E6E8EB">期 2 · 接通后端</text>
      <rect x="1014" y="245" width="12" height="12" rx="2" fill="#FFB547" fill-opacity="0.5"/><rect x="1032" y="245" width="12" height="12" rx="2" fill="#FFB547"/>
    </g>
    <g class="floor f3">
      <rect x="840" y="182" width="220" height="46" rx="4" fill="#1C222A" stroke="#3A434F"/>
      <text x="856" y="211" fill="#E6E8EB">期 3 · 数据与权限</text>
      <rect x="1014" y="199" width="12" height="12" rx="2" fill="#FFB547"/><rect x="1032" y="199" width="12" height="12" rx="2" fill="#FFB547" fill-opacity="0.5"/>
    </g>
    <g class="floor f4">
      <rect x="840" y="136" width="220" height="46" rx="4" fill="#1C222A" stroke="#3A434F"/>
      <text x="856" y="165" fill="#E6E8EB">期 4 · 打磨交付</text>
      <rect x="1014" y="153" width="12" height="12" rx="2" fill="#FFB547" fill-opacity="0.5"/><rect x="1032" y="153" width="12" height="12" rx="2" fill="#FFB547"/>
    </g>
    <g class="badge">
      <rect x="850" y="98" width="200" height="30" rx="15" fill="#3FB950" fill-opacity="0.14" stroke="#3FB950" stroke-opacity="0.7"/>
      <text x="950" y="118" text-anchor="middle" font-size="14" fill="#7EE787">✓ 已交付 · 可试用</text>
    </g>
  </g>
</svg>
